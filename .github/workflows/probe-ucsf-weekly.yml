name: Probe UCSF weekly endpoint
on:
  push:
    branches: [probe/ucsf-weekly]
    paths: ['scripts/probe-ucsf-weekly-trigger.txt']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Probe weekly response
        run: |
          node - <<'NODE'
          import {writeFile} from 'node:fs/promises';
          const root='https://webmenus.ucsfmedicalcenter.org/';
          const settings=await (await fetch(new URL('/webapi/settings/get',root))).json();
          const base=new URL('api/HospitalitySuite/',settings.apiUrl.endsWith('/')?settings.apiUrl:settings.apiUrl+'/');
          const headers={HsApplicationModule:'MealChoiceConnect',FacilityId:'PARN',Accept:'application/json','Content-Type':'application/json'};
          const menus=await (await fetch(new URL('menu/getMenus',base),{headers})).json();
          const meals=await (await fetch(new URL('meal/getMeals',base),{headers})).json();
          const today=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
          const start=new Date(`${today}T12:00:00Z`);
          const dates=Array.from({length:7},(_,i)=>{const d=new Date(start);d.setUTCDate(start.getUTCDate()+i);return d.toISOString().slice(0,10)});
          const menu=menus.find(x=>x.id!=null),mealIds=meals.filter(x=>x.mealId!=null&&!x.isNourishmentMeal).map(x=>x.mealId);
          const r=await fetch(new URL('publishingGroups/GuestMenuDataPerWeek',base),{method:'POST',headers,body:JSON.stringify({menuId:menu.id,mealIds,serveDates:dates})});
          let body;try{body=await r.json()}catch{body=await r.text()}
          await writeFile('ucsf-weekly-shape.json',JSON.stringify({status:r.status,menu,meals,dates,body},null,2));
          NODE
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ucsf-weekly-shape.json
          git commit -m "Capture UCSF weekly response shape" || exit 0
          git push
