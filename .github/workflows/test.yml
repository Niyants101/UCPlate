name: Test meal planner

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit tests
        run: node --test
      - name: Check browser JavaScript syntax
        run: |
          node --check app.js
          node --check goals.js
          node --check plate-planner.mjs
