name: Refresh UCPlate dining snapshot

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: menu-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh UC Santa Cruz menu snapshot
        run: node scripts/build-pages.mjs

      - name: Refresh UC San Diego menu snapshot
        run: node scripts/build-ucsd-pages.mjs

      - name: Commit updated menu data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Menu snapshot unchanged."
            exit 0
          fi
          git commit -m "Refresh UCPlate dining snapshots [skip ci]"
          git push
