name: Probe UCSF Mount Zion menus
on:
  push:
    branches: [feature/ucsf-cafe-filtering]
    paths:
      - 'scripts/probe-ucsf-zion-trigger.txt'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read Mount Zion menu catalog
        run: |
          node - <<'NODE'
          import {writeFile} from 'node:fs/promises';
          const root='https://webmenus.ucsfmedicalcenter.org/';
          const settings=await (await fetch(new URL('/webapi/settings/get',root))).json();
          const base=new URL('api/HospitalitySuite/',settings.apiUrl.endsWith('/')?settings.apiUrl:settings.apiUrl+'/');
          const headers={HsApplicationModule:'MealChoiceConnect',FacilityId:'ZION',Accept:'application/json'};
          const menus=await (await fetch(new URL('menu/getMenus',base),{headers})).json();
          await writeFile('ucsf-zion-menu-names.json',JSON.stringify(menus,null,2));
          NODE
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ucsf-zion-menu-names.json
          git commit -m "Capture Mount Zion menu names" || exit 0
          git push
