name: UCI retail probe

on:
  push:
    branches:
      - 'fix/campus-menu-quality-audit'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/probe-uci-locations.mjs
