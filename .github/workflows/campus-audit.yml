name: Campus menu quality audit

on:
  push:
    branches:
      - 'fix/campus-menu-quality-audit'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild Berkeley snapshot
        run: node scripts/build-ucb-pages.mjs
      - name: Rebuild Davis snapshot
        run: node scripts/build-ucd-pages.mjs
      - name: Rebuild Irvine snapshot
        run: node scripts/build-uci-pages.mjs
      - name: Rebuild UCLA snapshot
        run: node scripts/build-ucla-pages.mjs
      - name: Rebuild UC Merced snapshot
        run: node scripts/build-ucm-pages.mjs
      - name: Rebuild Riverside snapshot
        run: node scripts/build-ucr-pages.mjs
      - name: Rebuild Santa Barbara snapshot
        run: node scripts/build-ucsb-pages.mjs
      - name: Rebuild UCSF snapshot
        run: node scripts/build-ucsf-pages.mjs
      - name: Audit generated campus menu data
        run: node scripts/audit-campus-data.mjs
