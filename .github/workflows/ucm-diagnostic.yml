name: UC Merced API diagnostic

on:
  push:
    branches:
      - fix/ucm-hours-and-status

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect UC Merced BigZpoon nutrition
        run: node scripts/build-ucm-pages.mjs
