name: Probe UCSF menu source
on:
  push:
    branches: [feature/ucsf-dining]
    paths:
      - 'scripts/probe-ucsf-trigger.txt'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect UCSF Meal Choice Connect
        run: |
          node - <<'NODE'
          import {writeFile} from 'node:fs/promises';
          const root='https://webmenus.ucsfmedicalcenter.org/';
          const html=await (await fetch(root)).text();
          const main=html.match(/src=["'](main\.[^"']+\.js)["']/i)?.[1];
          const js=await (await fetch(new URL(main,root))).text();
          const terms=['HsApplicationModule','FacilityId','facilityId','dbName','DbName','database','Database','db params','createHeaders','activatedRoute','queryParamMap'];
          const contexts={};
          for(const term of terms){const rows=[];let start=0;while(rows.length<12){const i=js.indexOf(term,start);if(i<0)break;rows.push(js.slice(Math.max(0,i-1200),Math.min(js.length,i+term.length+1800)));start=i+term.length;}contexts[term]=rows;}
          await writeFile('ucsf-probe.json',JSON.stringify({main,contexts},null,2));
          NODE
      - name: Commit probe result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ucsf-probe.json
          git commit -m "Capture UCSF API header contexts" || exit 0
          git push
