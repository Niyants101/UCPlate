name: Probe UCSF menu source
on:
  push:
    branches: [feature/ucsf-dining]
    paths:
      - 'scripts/probe-ucsf-trigger.txt'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect UCSF Meal Choice Connect
        run: |
          node - <<'NODE'
          import {writeFile} from 'node:fs/promises';
          const root='https://webmenus.ucsfmedicalcenter.org/';
          const settings=await (await fetch(new URL('/webapi/settings/get',root))).json();
          const apiBase=new URL('api/HospitalitySuite/',settings.apiUrl.endsWith('/')?settings.apiUrl:settings.apiUrl+'/');
          const today=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
          const facilities=[
            {facilityId:'PARN',facilityName:'Parnassus Cafe Menu'},
            {facilityId:'MBH',facilityName:'Mission Bay Cafe Menu'},
            {facilityId:'ZION',facilityName:'Mount Zion Patient and Cafe Menu'}
          ];
          const results=[];
          for(const facility of facilities){
            const headers={HsApplicationModule:'MealChoiceConnect',FacilityId:facility.facilityId,Accept:'application/json','Content-Type':'application/json'};
            const get=async(path,params={})=>{const u=new URL(path,apiBase);for(const[k,v]of Object.entries(params))u.searchParams.set(k,v);const r=await fetch(u,{headers});let body;try{body=await r.json()}catch{body=await r.text()}return {status:r.status,body}};
            const menus=await get('menu/getMenus');
            const meals=await get('meal/getMeals');
            const menuList=Array.isArray(menus.body)?menus.body:[];
            const mealList=Array.isArray(meals.body)?meals.body:[];
            let sample=null;
            outer: for(const menu of menuList){for(const meal of mealList){const data=await get('publishingGroups/GuestMenuData',{menuId:menu.id,mealId:meal.mealId,serveDate:today});if(Array.isArray(data.body)&&data.body.some(g=>g.menuItems?.length)){const group=data.body.find(g=>g.menuItems?.length);const item=group.menuItems[0];const recipeId=item.recipeId;const [recipe,nutrients,nutrition,ingredients,allergens]=await Promise.all([
              get('recipes/RecipeDetails',{recipeId}),get('nutrients/getBaseNutrientsForRecipe',{recipeId}),get('nutrients/getNutritionFactsGeneralInformation',{recipeId}),get('ingredient/getIngredientNestedDescription',{recipeId}),get('allergen/getAllergenNestedDescription',{recipeId})
            ]);sample={menu,meal,groups:data.body.map(g=>({publishingGroup:g.publishingGroup,menuItems:(g.menuItems||[]).slice(0,4)})).slice(0,4),recipe,nutrients,nutrition,ingredients,allergens};break outer;}}}
            results.push({facility,menus:menuList,meals:mealList,sample});
          }
          await writeFile('ucsf-probe.json',JSON.stringify({settings,today,results},null,2));
          NODE
      - name: Commit probe result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ucsf-probe.json
          git commit -m "Capture UCSF compact retail nutrition data" || exit 0
          git push
