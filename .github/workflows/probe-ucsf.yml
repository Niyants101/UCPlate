name: Probe UCSF menu source
on:
  push:
    branches: [feature/ucsf-dining]
    paths:
      - 'scripts/probe-ucsf-trigger.txt'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect UCSF Meal Choice Connect
        run: |
          node - <<'NODE'
          import {writeFile} from 'node:fs/promises';
          const base='https://webmenus.ucsfmedicalcenter.org/';
          const html=await (await fetch(base)).text();
          const main=html.match(/src=["'](main\.[^"']+\.js)["']/i)?.[1];
          if(!main)throw new Error('main bundle not found');
          const js=await (await fetch(new URL(main,base))).text();
          const strings=[...js.matchAll(/["'`]([^"'`]{1,180})["'`]/g)].map(m=>m[1]);
          const interesting=[...new Set(strings.filter(s=>/api|menu|facility|recipe|meal|category|nutrition|allergen|date/i.test(s)).filter(s=>s.length<180))].slice(0,1200);
          const urls=[...new Set([...js.matchAll(/https?:\\?\/?\\?\/?[^"'`\\s)]+/g)].map(m=>m[0]))].slice(0,200);
          await writeFile('ucsf-probe.json',JSON.stringify({main,interesting,urls},null,2));
          NODE
      - name: Commit probe result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ucsf-probe.json
          git commit -m "Capture UCSF API probe" || exit 0
          git push
